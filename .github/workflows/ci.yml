name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GNOME packaging and shell validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-shell shellcheck

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Build and verify release assets
        run: ./scripts/build-release.sh v1.0.0

      - name: Inspect archive contents
        run: |
          unzip -Z1 dist/discord-voice-overlay-gnome-v1.0.0.zip
          unzip -Z1 dist/discord-voice-overlay-vencord-plugin-v1.0.0.zip
          (cd dist && sha256sum -c SHA256SUMS)

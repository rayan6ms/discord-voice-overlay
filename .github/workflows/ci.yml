name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install schema and shell validation tools
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
            libglib2.0-bin ripgrep shellcheck

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Build and verify release assets
        run: ./scripts/build-release.sh v1.0.1

      - name: Inspect archive contents
        run: |
          unzip -Z1 dist/discord-voice-overlay-gnome-v1.0.1.zip
          unzip -Z1 dist/discord-voice-overlay-vencord-plugin-v1.0.1.zip
          sh -n dist/install.sh
          grep -F 'RELEASE_TAG=${DVO_VERSION:-v1.0.1}' dist/install.sh
          (cd dist && sha256sum -c SHA256SUMS)
